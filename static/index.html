<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Voice AI Assistant (OpenRouter)</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 20px 60px;
      background: var(--bg);
      color: var(--text-main);
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    .status-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-idle { background: #334155; color: #cbd5e1; }
    .status-listening { background: #065f46; color: #34d399; animation: pulse 1.5s infinite; }
    .status-thinking { background: #1e3a8a; color: #60a5fa; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.98); }
    }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-start { background: var(--success); color: white; }
    .btn-start:hover { background: #059669; }
    .btn-stop { background: var(--danger); color: white; }
    .btn-stop:hover { background: #dc2626; }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select {
      width: 100%;
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    select:focus {
      border-color: var(--accent);
    }
    .box-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      min-height: 80px;
      font-size: 15px;
      line-height: 1.6;
    }
    .interim { color: #64748b; font-style: italic; }
    .refined-box {
      background: #0f172a;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 16px;
      min-height: 110px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .history-item {
      background: #0f172a;
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 4px;
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎙️ Live Voice Assistant</h1>
    <p class="subtitle">Hands-free real-time speech transcription with automatic pause detection & OpenRouter free LLM refinement.</p>
  </header>

  <div class="card">
    <div class="status-container">
      <div id="statusBadge" class="status-badge status-idle">● Mic Idle</div>
      <span id="countdownText" style="font-size: 13px; color: var(--text-muted);"></span>
    </div>

    <div class="btn-row">
      <button id="startBtn" class="btn btn-start" onclick="toggleListening()">Start Hands-Free Mic</button>
    </div>

    <div class="grid">
      <div>
        <label>AI Mode</label>
        <select id="instructionSelect">
          <option value="Fix grammar, punctuation, remove filler words, and polish formatting cleanly.">Clean & Polish Grammar</option>
          <option value="Summarize the core points into concise bullet points and action items.">Instant Summary & Action Items</option>
          <option value="Answer or respond to the user query conversationally and concisely.">Conversational Copilot (Answer Question)</option>
          <option value="Translate the spoken text directly to professional English.">Translate to English</option>
        </select>
      </div>

      <div>
        <label>Auto-Send Pause Delay</label>
        <select id="silenceDelay">
          <option value="1500">1.5 Seconds (Fast)</option>
          <option value="2000" selected>2.0 Seconds (Recommended)</option>
          <option value="3000">3.0 Seconds (Long Pauses)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="box-title">🔴 Real-Time Spoken Words</div>
    <div class="box">
      <span id="finalText"></span>
      <span id="interimText" class="interim"></span>
    </div>

    <div class="box-title" style="margin-top: 20px;">✨ OpenRouter LLM Response</div>
    <div id="llmResult" class="refined-box">Responses will appear here automatically when you pause speaking...</div>
  </div>

  <script>
    let ws;
    let recognition;
    let isListening = false;
    let finalTranscript = "";
    let silenceTimer = null;
    let lastProcessedText = "";

    function initWebSocket() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws/transcribe`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        const badge = document.getElementById("statusBadge");

        if (msg.event === "llm_start") {
          badge.className = "status-badge status-thinking";
          badge.innerText = "● OpenRouter Processing...";
          document.getElementById("llmResult").innerText = "Generating AI response...";
        } else if (msg.event === "llm_result") {
          document.getElementById("llmResult").innerText = msg.data;
          if (isListening) {
            badge.className = "status-badge status-listening";
            badge.innerText = "● Listening in real-time...";
          }
        } else if (msg.event === "error") {
          document.getElementById("llmResult").innerText = "⚠️ " + msg.data;
          if (isListening) {
            badge.className = "status-badge status-listening";
            badge.innerText = "● Listening in real-time...";
          }
        }
      };

      ws.onclose = () => {
        setTimeout(initWebSocket, 2000);
      };
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Live speech recognition requires Google Chrome, Microsoft Edge, or Safari.");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onresult = (event) => {
        let interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + " ";
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        document.getElementById("finalText").innerText = finalTranscript;
        document.getElementById("interimText").innerText = interimTranscript;

        resetSilenceTimer();
      };

      recognition.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        }
      };
    }

    function resetSilenceTimer() {
      if (silenceTimer) clearTimeout(silenceTimer);

      const delay = parseInt(document.getElementById("silenceDelay").value, 10);
      const countdownSpan = document.getElementById("countdownText");
      countdownSpan.innerText = "Listening to speech...";

      silenceTimer = setTimeout(() => {
        countdownSpan.innerText = "Pause detected — querying AI...";
        triggerAutoSend();
      }, delay);
    }

    function triggerAutoSend() {
      const currentFullText = (finalTranscript + " " + document.getElementById("interimText").innerText).trim();

      if (!currentFullText || currentFullText === lastProcessedText) {
        document.getElementById("countdownText").innerText = "";
        return;
      }

      lastProcessedText = currentFullText;
      const instruction = document.getElementById("instructionSelect").value;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          text: currentFullText,
          instruction: instruction
        }));
      }

      finalTranscript = "";
      document.getElementById("finalText").innerText = "";
      document.getElementById("interimText").innerText = "";
      document.getElementById("countdownText").innerText = "";
    }

    function toggleListening() {
      const btn = document.getElementById("startBtn");
      const badge = document.getElementById("statusBadge");

      if (!isListening) {
        finalTranscript = "";
        lastProcessedText = "";
        document.getElementById("finalText").innerText = "";
        document.getElementById("interimText").innerText = "";

        recognition.start();
        isListening = true;

        btn.innerText = "Stop Hands-Free Mic";
        btn.className = "btn btn-stop";
        badge.innerText = "● Listening in real-time...";
        badge.className = "status-badge status-listening";
      } else {
        if (silenceTimer) clearTimeout(silenceTimer);
        recognition.stop();
        isListening = false;

        btn.innerText = "Start Hands-Free Mic";
        btn.className = "btn btn-start";
        badge.innerText = "● Mic Idle";
        badge.className = "status-badge status-idle";
        document.getElementById("countdownText").innerText = "";
      }
    }

    window.onload = initWebSocket;
  </script>
</body>
</html>
